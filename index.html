<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rational Luthier v3.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; transition: all 0.3s ease; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass-card { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 4px; }
        .input-minimal { border-bottom: 2px solid #e5e7eb; transition: border-color 0.2s; }
        .input-minimal:focus { border-color: #d97706; outline: none; }
        .sidebar { border-right: 1px solid #e5e7eb; }
        @media (max-width: 1024px) { .sidebar { border-right: none; border-bottom: 1px solid #e5e7eb; } }
    </style>
</head>
<body class="bg-stone-50 text-zinc-900">

    <div class="flex flex-col lg:flex-row min-h-screen">
        
        <aside class="lg:w-96 bg-white p-8 sidebar space-y-10">
            <div>
                <h1 class="text-3xl font-black tracking-tighter italic mb-1 uppercase">Rational <span class="text-amber-600">Luthier</span></h1>
                <p class="text-[10px] font-bold text-zinc-400 uppercase tracking-[0.2em]">Workshop Studio v3.3</p>
            </div>

            <section class="space-y-6">
                <div>
                    <label class="text-[11px] font-black uppercase text-zinc-400 tracking-widest block mb-2">Instrument Architecture</label>
                    <select id="instrument" class="w-full bg-stone-100 p-3 font-bold text-sm rounded cursor-pointer" onchange="initProjectUI()">
                        <optgroup label="Violin Family">
                            <option value="violin">Violin (Stradivari)</option>
                            <option value="viola">Viola (16")</option>
                            <option value="cello">Cello (75.5cm)</option>
                            <option value="bass_violin">Bass Violin (Borbon)</option>
                        </optgroup>
                        <optgroup label="Early Music">
                            <option value="viol_jaye">Bass Viol (Jaye)</option>
                            <option value="viol_colichon">Bass Viol (Colichon)</option>
                        </optgroup>
                        <optgroup label="Lutherie Plucked">
                            <option value="classical_hauser">Classical (Hauser)</option>
                            <option value="steel_string_om">Steel String (OM)</option>
                        </optgroup>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <button id="btnFront" onclick="setPlate('front')" class="py-2 text-[10px] font-black rounded border-2 border-zinc-900 bg-zinc-900 text-white transition">FRONT</button>
                    <button id="btnBack" onclick="setPlate('back')" class="py-2 text-[10px] font-black rounded border-2 border-stone-200 text-zinc-400 hover:border-zinc-900 transition">BACK</button>
                </div>

                <div id="archingContainer">
                    <label class="text-[11px] font-black uppercase text-zinc-400 tracking-widest block mb-2">Arching Profile</label>
                    <select id="arching" class="w-full bg-stone-100 p-3 font-bold text-sm rounded cursor-pointer" onchange="calculate()">
                        <option value="flat">Standard (Low/Flat)</option>
                        <option value="high">High (Stainer/Amati)</option>
                    </select>
                </div>

                <div>
                    <label class="text-[11px] font-black uppercase text-zinc-400 tracking-widest block mb-2">Work Step</label>
                    <select id="step" class="w-full bg-amber-50 p-3 font-black text-sm text-amber-900 rounded border border-amber-100" onchange="calculate()">
                        </select>
                </div>
            </section>

            <section class="pt-6 border-t border-stone-100 space-y-6">
                <label class="text-[11px] font-black uppercase text-zinc-400 tracking-widest block">Material Physics</label>
                <div>
                    <span class="text-[10px] font-bold text-zinc-500 uppercase">Density (ρ)</span>
                    <input type="number" id="density" value="0.37" step="0.01" class="w-full py-2 bg-transparent input-minimal mono text-xl font-bold" oninput="calculate()">
                </div>
                <div>
                    <span class="text-[10px] font-bold text-zinc-500 uppercase">Speed of Sound (Optional)</span>
                    <input type="number" id="speed" placeholder="m/s" class="w-full py-2 bg-transparent input-minimal mono text-xl font-bold" oninput="calculate()">
                </div>
            </section>
        </aside>

        <main class="flex-1 p-8 lg:p-16 space-y-12">
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="glass-card p-6 border-l-4 border-amber-600">
                    <span class="text-[10px] font-black uppercase text-zinc-400 tracking-widest">Target Mass</span>
                    <div id="targetMass" class="text-4xl font-black italic mono mt-2 text-zinc-800">--</div>
                </div>
                <div class="glass-card p-6 border-l-4 border-zinc-900">
                    <span id="targetModeLabel" class="text-[10px] font-black uppercase text-zinc-400 tracking-widest">Target Freq</span>
                    <div id="targetFreq" class="text-4xl font-black italic mono mt-2 text-zinc-800">--</div>
                </div>
                <div class="glass-card p-6 border-l-4 border-stone-300">
                    <span class="text-[10px] font-black uppercase text-zinc-400 tracking-widest">Est. Thickness</span>
                    <div id="predictedThickness" class="text-4xl font-black italic mono mt-2 text-stone-400">--</div>
                </div>
            </div>

            <section class="bg-zinc-900 text-white rounded-lg p-10 shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 right-0 p-8 opacity-10">
                    <svg width="120" height="120" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
                </div>
                
                <div class="flex justify-between items-center mb-10">
                    <h2 class="text-2xl font-black italic uppercase tracking-tighter">The Rational Doctor</h2>
                    <div id="efficiencyTag" class="text-4xl font-black mono text-amber-500">--%</div>
                </div>

                <div class="grid grid-cols-1 xl:grid-cols-2 gap-16">
                    <div class="space-y-8">
                        <div>
                            <label class="text-[10px] font-black uppercase text-zinc-500 tracking-[0.2em] block mb-4">Workbench Inputs</label>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <input type="number" id="currMass" placeholder="00.0" class="w-full bg-zinc-800 border-b-2 border-zinc-700 p-4 font-black text-3xl text-amber-500 mono rounded" oninput="diagnose()">
                                    <span class="text-[10px] font-bold text-zinc-500 block mt-2 text-center uppercase">Grams (g)</span>
                                </div>
                                <div>
                                    <input type="number" id="currFreq" placeholder="000" class="w-full bg-zinc-800 border-b-2 border-zinc-700 p-4 font-black text-3xl text-amber-500 mono rounded" oninput="diagnose()">
                                    <span class="text-[10px] font-bold text-zinc-500 block mt-2 text-center uppercase">Hertz (Hz)</span>
                                </div>
                            </div>
                        </div>
                        <button onclick="saveToLog()" class="w-full py-4 bg-zinc-100 text-zinc-900 font-black text-xs uppercase tracking-widest hover:bg-amber-500 hover:text-white transition">Commit to Log</button>
                    </div>

                    <div class="space-y-6">
                        <label class="text-[10px] font-black uppercase text-zinc-500 tracking-[0.2em] block">Active Directives</label>
                        <div id="diagnosisBox" class="text-lg font-medium text-zinc-300 leading-relaxed border-l-2 border-amber-600 pl-6 italic">
                            Waiting for workbench data...
                        </div>
                        <div id="componentAdvice" class="bg-zinc-800/50 p-6 rounded text-sm text-stone-300 space-y-4">
                            </div>
                    </div>
                </div>
            </section>

            <section class="space-y-4">
                <div class="flex justify-between items-end">
                    <h3 class="text-xs font-black uppercase text-zinc-400 tracking-[0.3em]">History Log</h3>
                    <button onclick="exportReport()" class="text-[10px] font-bold uppercase text-amber-600 hover:underline">Download Workshop Data (.json)</button>
                </div>
                <div class="overflow-hidden glass-card">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-stone-100 text-[10px] uppercase font-black text-zinc-500">
                            <tr>
                                <th class="px-6 py-4">Phase</th>
                                <th class="px-6 py-4">Mass (g)</th>
                                <th class="px-6 py-4">Freq (Hz)</th>
                                <th class="px-6 py-4">Efficiency</th>
                            </tr>
                        </thead>
                        <tbody id="historyBody" class="divide-y divide-stone-100 mono">
                            </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script>
        let currentPlate = 'front';
        let history = [];

        const library = {
            violin: { f_raw: {m:62, f:305, d:0.37, c:5200, t:3.0, mode:'M5'}, f_holes: {m:60, f:290, d:0.37, c:5200, t:3.0, mode:'M5'}, f_barred: {m:66, f:345, d:0.37, c:5200, t:3.0, mode:'M5'}, back: {m:108, f:370, d:0.58, c:4200, t:4.5, mode:'M5'} },
            viola: { f_raw: {m:98, f:270, d:0.38, c:5200, t:3.2, mode:'M5'}, f_holes: {m:95, f:258, d:0.38, c:5200, t:3.2, mode:'M5'}, f_barred: {m:105, f:310, d:0.38, c:5200, t:3.2, mode:'M5'}, back: {m:165, f:330, d:0.59, c:4200, t:5.0, mode:'M5'} },
            cello: { f_raw: {m:380, f:145, d:0.35, c:5100, t:5.5, mode:'M5'}, f_holes: {m:372, f:136, d:0.35, c:5100, t:5.5, mode:'M5'}, f_barred: {m:420, f:170, d:0.35, c:5100, t:5.5, mode:'M5'}, back: {m:760, f:190, d:0.60, c:4100, t:8.5, mode:'M5'} },
            bass_violin: { f_raw: {m:430, f:125, d:0.35, c:5000, t:6.5, mode:'M5'}, f_holes: {m:420, f:116, d:0.35, c:5000, t:6.5, mode:'M5'}, f_barred: {m:465, f:155, d:0.35, c:5000, t:6.5, mode:'M5'}, back: {m:860, f:180, d:0.61, c:4100, t:9.5, mode:'M5'} },
            viol_jaye: { f_raw: {m:165, f:105, d:0.36, c:5200, t:2.8, mode:'M5'}, back: {m:280, f:115, d:0.62, c:4200, t:4.0, mode:'M5'} },
            viol_colichon: { f_raw: {m:210, f:88, d:0.36, c:5200, t:3.0, mode:'M5'}, back: {m:370, f:102, d:0.62, c:4200, t:4.2, mode:'M5'} },
            classical_hauser: { f_raw: {m:132, f:98, d:0.40, c:5400, t:2.6, mode:'M2'}, f_holes: {m:128, f:92, d:0.40, c:5400, t:2.6, mode:'M2'}, f_braced: {m:178, f:188, d:0.40, c:5400, t:2.6, mode:'M4'}, back: {m:215, f:225, d:0.82, c:4400, t:2.2, mode:'M5'} },
            steel_string_om: { f_raw: {m:148, f:105, d:0.42, c:5400, t:2.8, mode:'M2'}, f_holes: {m:144, f:98, d:0.42, c:5400, t:2.8, mode:'M2'}, f_braced: {m:215, f:208, d:0.42, c:5400, t:2.8, mode:'M4'}, back: {m:245, f:245, d:0.84, c:4400, t:2.4, mode:'M5'} }
        };

        function initProjectUI() {
            const inst = document.getElementById('instrument').value;
            const stepSel = document.getElementById('step');
            const archCont = document.getElementById('archingContainer');
            archCont.style.display = (inst.includes('hauser') || inst.includes('om')) ? 'none' : 'block';

            if (currentPlate === 'front') {
                stepSel.innerHTML = (inst.includes('hauser') || inst.includes('om')) ? 
                    `<option value="f_raw">Raw Plate</option><option value="f_holes">Soundhole Cut</option><option value="f_braced">Bracing Phase</option>` :
                    (inst.includes('viol_')) ? `<option value="f_raw">Plate Graduation</option>` :
                    `<option value="f_raw">Raw Plate</option><option value="f_holes">F-Holes Cut</option><option value="f_barred">Bass Bar Phase</option>`;
            } else {
                stepSel.innerHTML = `<option value="back">Final Back Graduation</option>`;
            }
            calculate();
        }

        function setPlate(type) {
            currentPlate = type;
            document.getElementById('btnFront').className = type === 'front' ? 'py-2 text-[10px] font-black rounded border-2 border-zinc-900 bg-zinc-900 text-white transition' : 'py-2 text-[10px] font-black rounded border-2 border-stone-200 text-zinc-400 hover:border-zinc-900 transition';
            document.getElementById('btnBack').className = type === 'back' ? 'py-2 text-[10px] font-black rounded border-2 border-zinc-900 bg-zinc-900 text-white transition' : 'py-2 text-[10px] font-black rounded border-2 border-stone-200 text-zinc-400 hover:border-zinc-900 transition';
            initProjectUI();
        }

        function calculate() {
            const inst = document.getElementById('instrument').value;
            const step = document.getElementById('step').value;
            const arch = document.getElementById('arching').value;
            const dens = parseFloat(document.getElementById('density').value) || 0.37;
            const speed = parseFloat(document.getElementById('speed').value);
            const ref = library[inst][step] || library[inst].back;
            
            let tM = ref.m * (dens / ref.d);
            let tF = ref.f * Math.sqrt(ref.d / dens);
            if (speed > 0) tF *= (speed / ref.c);
            if (!(inst.includes('hauser') || inst.includes('om')) && arch === 'high') { tM *= 0.94; tF *= 1.02; }
            
            document.getElementById('targetMass').innerText = Math.round(tM) + 'g';
            document.getElementById('targetFreq').innerText = Math.round(tF) + 'Hz';
            document.getElementById('predictedThickness').innerText = (ref.t * (ref.d / dens)).toFixed(1) + 'mm';
            document.getElementById('targetModeLabel').innerText = `Target Freq (${ref.mode})`;
            updateDoctorAdvice();
            diagnose();
        }

        function updateDoctorAdvice() {
            const inst = document.getElementById('instrument').value;
            const step = document.getElementById('step').value;
            const adviceDiv = document.getElementById('componentAdvice');
            
            let text = "";
            if (step === 'f_barred' || step === 'f_braced') {
                if (inst === 'violin') text = "<b>Bass Bar Directives:</b> Length 270mm. Width 5.5mm. Max height 11mm. Weight target: 3.5g - 4.5g.";
                else if (inst === 'cello') text = "<b>Bass Bar Directives:</b> Length 580mm. Width 10.5mm. Max height 26mm. Weight target: 22g - 28g.";
                else if (inst.includes('hauser')) text = "<b>Bracing Directives:</b> Focus on the Fan. Seven braces, thickness 3mm, height 4mm at center. Taper ends to zero.";
                else if (inst.includes('om')) text = "<b>X-Bracing:</b> Maintain 19mm height at the lap joint. Scallop the tone bars to reach the target frequency.";
            } else if (step === 'f_holes') {
                text = "<b>F-Hole Warning:</b> Expect a significant drop in longitudinal stiffness. This step 'unlocks' the plate; do not thin further until f-holes are fully cut.";
            } else {
                text = "<b>Graduation Advice:</b> Maintain the 'central spine' at predicted thickness. Thin the upper and lower bouts (the lungs) to shed mass while preserving fundamental pitch.";
            }
            adviceDiv.innerHTML = text;
        }

        function diagnose() {
            const cM = parseFloat(document.getElementById('currMass').value);
            const cF = parseFloat(document.getElementById('currFreq').value);
            const tM = parseFloat(document.getElementById('targetMass').innerText);
            const tF = parseFloat(document.getElementById('targetFreq').innerText);
            if (!cM || !cF) return;
            const eff = Math.round(((cF / cM) / (tF / tM)) * 100);
            const box = document.getElementById('diagnosisBox');
            document.getElementById('efficiencyTag').innerText = eff + "%";

            if (eff >= 98 && eff <= 102) {
                box.innerHTML = "Rational peak detected. The plate resonance is perfectly coupled to the material mass. No further thinning recommended.";
            } else if (eff < 98) {
                box.innerHTML = "The plate is currently Damped. You have excess mass that isn't providing stiffness. Focus on thinning the peripheral regions (the lungs).";
            } else {
                box.innerHTML = "The plate is Over-Stiff. The frequency is too high for this mass. Thin the central spine or bridge area to allow for greater flexibility.";
            }
        }

        function saveToLog() {
            const log = {
                step: document.getElementById('step').value,
                mass: document.getElementById('currMass').value,
                freq: document.getElementById('currFreq').value,
                eff: document.getElementById('efficiencyTag').innerText
            };
            if(!log.mass || !log.freq) return;
            history.unshift(log);
            document.getElementById('historyBody').innerHTML = history.map(h => `
                <tr>
                    <td class="px-6 py-4 uppercase font-bold text-zinc-400 text-[10px]">${h.step.replace('f_', '')}</td>
                    <td class="px-6 py-4 font-bold text-amber-600">${h.mass}g</td>
                    <td class="px-6 py-4 font-bold">${h.freq}Hz</td>
                    <td class="px-6 py-4 text-zinc-400 italic">${h.eff}</td>
                </tr>
            `).join('');
        }

        initProjectUI();
    </script>
</body>
</html>
