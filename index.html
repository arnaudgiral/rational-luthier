<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rational Luthier v3.6 Refined</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fbfbfb; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .sidebar { border-right: 1px solid #e5e7eb; }
        .directive-bar { border-left: 4px solid #f59e0b; padding-left: 1.25rem; }
        .glass-card { background: white; border: 1px solid #efefef; border-radius: 8px; }
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
        .input-focus:focus { outline: none; border-bottom: 2px solid #f59e0b; }
    </style>
</head>
<body class="text-zinc-900">

    <div class="flex flex-col lg:flex-row min-h-screen">
        
        <aside class="lg:w-80 bg-white p-8 sidebar space-y-8">
            <header>
                <h1 class="text-2xl font-black tracking-tighter italic uppercase">Rational <span class="text-amber-600">Luthier</span></h1>
                <p class="text-[9px] font-bold text-zinc-400 uppercase tracking-widest">Precision Studio v3.6 Refined</p>
            </header>

            <div class="space-y-6">
                <section>
                    <label class="text-[10px] font-black uppercase text-zinc-400 mb-2 block">Instrument Architecture</label>
                    <select id="instrument" class="w-full bg-stone-50 p-3 font-bold text-sm border-none rounded" onchange="initProjectUI()">
                        <optgroup label="Bowed Strings (Violin Family)">
                            <option value="violin">Violin (35.5cm)</option>
                            <option value="viola">Viola (41cm)</option>
                            <option value="cello">Cello (75.5cm)</option>
                            <option value="bass_violin">Bass Violin (80cm)</option>
                        </optgroup>
                        <optgroup label="The Viol Family">
                            <option value="viol_jaye">Bass Viol (Jaye - 62cm)</option>
                            <option value="viol_colichon">Bass Viol (Colichon - 70cm)</option>
                        </optgroup>
                        <optgroup label="Plucked Strings">
                            <option value="classical_hauser">Classical (Hauser)</option>
                            <option value="steel_string_om">Steel String (OM)</option>
                        </optgroup>
                    </select>
                </section>

                <div class="grid grid-cols-2 gap-2">
                    <button id="btnFront" onclick="setPlate('front')" class="py-2 text-[10px] font-black rounded bg-zinc-900 text-white">FRONT</button>
                    <button id="btnBack" onclick="setPlate('back')" class="py-2 text-[10px] font-black rounded bg-stone-100 text-zinc-400">BACK</button>
                </div>

                <div id="archingContainer">
                    <label class="text-[10px] font-black uppercase text-zinc-400 mb-2 block">Arching Profile</label>
                    <select id="arching" class="w-full bg-stone-50 p-3 font-bold text-sm border-none rounded" onchange="calculate()">
                        <option value="flat">Low arch (Strad/Del Gesu)</option>
                        <option value="high">High arch (Amati/Stainer)</option>
                    </select>
                </div>

                <section>
                    <label class="text-[10px] font-black uppercase text-zinc-400 mb-2 block">Build Milestone</label>
                    <select id="step" class="w-full bg-amber-50 p-3 font-black text-sm text-amber-900 border-none rounded" onchange="calculate()">
                    </select>
                </section>

                <section class="pt-6 border-t border-stone-100">
                    <label class="text-[10px] font-black uppercase text-zinc-400 mb-4 block">Material Physics</label>
                    <div class="space-y-4">
                        <div>
                            <span class="text-[10px] font-bold text-zinc-400 uppercase italic">Density (ρ)</span>
                            <input type="number" id="density" value="0.37" step="0.01" class="w-full py-1 bg-transparent border-b border-stone-200 mono text-lg font-bold input-focus" oninput="calculate()">
                        </div>
                    </div>
                </section>
            </div>
        </aside>

        <main class="flex-1 p-6 lg:p-12 space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="glass-card p-6 border-t-2 border-zinc-100">
                    <span class="text-[10px] font-black uppercase text-zinc-400 tracking-widest">Target Mass</span>
                    <div id="targetMass" class="text-4xl font-black italic mono mt-1 text-zinc-800">--</div>
                </div>
                <div class="glass-card p-6 border-t-2 border-zinc-100">
                    <span id="targetModeLabel" class="text-[10px] font-black uppercase text-zinc-400 tracking-widest">Target Frequency</span>
                    <div id="targetFreq" class="text-4xl font-black italic mono mt-1 text-zinc-800">--</div>
                </div>
                <div class="glass-card p-6 border-t-2 border-zinc-100">
                    <span class="text-[10px] font-black uppercase text-zinc-400 tracking-widest">Est. Thickness</span>
                    <div id="predictedThickness" class="text-4xl font-black italic mono mt-1 text-amber-600">--</div>
                </div>
            </div>

            <section class="bg-zinc-900 text-white rounded-xl p-8 lg:p-12 shadow-2xl">
                <div class="flex justify-between items-center mb-12">
                    <h2 class="text-3xl font-black italic uppercase tracking-tighter">The Rational Doctor</h2>
                    <div id="efficiencyTag" class="text-5xl font-black mono text-amber-500">--%</div>
                </div>

                <div class="grid grid-cols-1 xl:grid-cols-2 gap-16">
                    <div class="space-y-8">
                        <div>
                            <label class="text-[10px] font-black uppercase text-zinc-500 mb-4 block tracking-[0.2em]">Workbench Readings</label>
                            <div class="grid grid-cols-2 gap-6">
                                <div>
                                    <input type="number" id="currMass" placeholder="0.0" class="w-full bg-zinc-800 border-none p-5 font-black text-4xl text-amber-500 mono rounded-lg" oninput="diagnose()">
                                    <span class="text-[10px] font-bold text-zinc-600 block mt-2 text-center uppercase">Grams (g)</span>
                                </div>
                                <div>
                                    <input type="number" id="currFreq" placeholder="000" class="w-full bg-zinc-800 border-none p-5 font-black text-4xl text-amber-500 mono rounded-lg" oninput="diagnose()">
                                    <span class="text-[10px] font-bold text-zinc-600 block mt-2 text-center uppercase">Hertz (Hz)</span>
                                </div>
                            </div>
                        </div>
                        <button onclick="saveToLog()" class="w-full py-4 bg-amber-600 text-white font-black text-xs uppercase tracking-widest hover:bg-amber-500 transition rounded-lg shadow-lg">Record Log Entry</button>
                    </div>

                    <div class="space-y-8">
                        <div class="directive-bar">
                            <h4 class="text-[11px] font-black uppercase text-amber-500 mb-3 tracking-widest">Active Directives</h4>
                            <div id="diagnosisBox" class="text-lg font-bold text-zinc-100 leading-snug italic">
                                Ready for bench measurements.
                            </div>
                        </div>

                        <div class="directive-bar">
                            <h4 class="text-[11px] font-black uppercase text-amber-500 mb-3 tracking-widest">Graduation Advice</h4>
                            <div id="compAdvice" class="text-sm font-medium text-zinc-400 space-y-4 leading-relaxed">
                                Standing by for instrument selection.
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="text-[10px] uppercase font-black text-zinc-400 border-b border-stone-200">
                        <tr><th class="pb-4 px-2">Build Step</th><th class="pb-4">Mass</th><th class="pb-4">Freq</th><th class="pb-4">Efficiency</th></tr>
                    </thead>
                    <tbody id="historyBody" class="divide-y divide-stone-100 mono text-xs"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        let currentPlate = 'front';
        let history = [];

        // REFINED LIBRARY: Viols now include full milestone paths (f_raw -> f_holes -> f_barred)
        const library = {
            violin: { f_raw: {m:62, f:305, d:0.37, t:2.8, mode:'M5'}, f_holes: {m:60, f:288, d:0.37, t:2.8, mode:'M5'}, f_barred: {m:65, f:340, d:0.37, t:2.8, mode:'M5'}, back: {m:105, f:360, d:0.59, t:4.2, mode:'M5'} },
            viola: { f_raw: {m:95, f:265, d:0.38, t:3.1, mode:'M5'}, f_holes: {m:92, f:250, d:0.38, t:3.1, mode:'M5'}, f_barred: {m:102, f:305, d:0.38, t:3.1, mode:'M5'}, back: {m:160, f:325, d:0.59, t:4.8, mode:'M5'} },
            cello: { f_raw: {m:370, f:142, d:0.36, t:5.2, mode:'M5'}, f_holes: {m:362, f:135, d:0.36, t:5.2, mode:'M5'}, f_barred: {m:410, f:168, d:0.36, t:5.2, mode:'M5'}, back: {m:650, f:185, d:0.61, t:8.0, mode:'M5'} },
            bass_violin: { f_raw: {m:430, f:125, d:0.35, t:6.5, mode:'M5'}, f_holes: {m:420, f:116, d:0.35, t:6.5, mode:'M5'}, f_barred: {m:465, f:155, d:0.35, t:6.5, mode:'M5'}, back: {m:860, f:180, d:0.61, t:9.5, mode:'M5'} },
            
            // VIOL UPDATES: Calibrated based on search data (Colichon 1683 / Jaye 1629)
            // Note: Viols lose more stiffness relative to mass when holes are cut due to the thinner plate.
            viol_jaye: { 
                f_raw: {m:142, f:112, d:0.36, t:2.3, mode:'M5'}, 
                f_holes: {m:139, f:104, d:0.36, t:2.3, mode:'M5'}, 
                f_barred: {m:155, f:130, d:0.36, t:2.3, mode:'M5'}, 
                back: {m:220, f:124, d:0.62, t:3.0, mode:'M5'} 
            },
            viol_colichon: { 
                f_raw: {m:205, f:85, d:0.36, t:2.6, mode:'M5'}, 
                f_holes: {m:200, f:78, d:0.36, t:2.6, mode:'M5'}, 
                f_barred: {m:225, f:105, d:0.36, t:2.6, mode:'M5'}, 
                back: {m:320, f:98, d:0.62, t:3.5, mode:'M5'} 
            },
            
            classical_hauser: { f_raw: {m:130, f:95, d:0.40, t:2.4, mode:'M2'}, f_holes: {m:126, f:90, d:0.40, t:2.4, mode:'M2'}, f_braced: {m:175, f:185, d:0.40, t:2.4, mode:'M4'}, back: {m:210, f:220, d:0.82, t:2.1, mode:'M5'} },
            steel_string_om: { f_raw: {m:145, f:102, d:0.43, t:2.6, mode:'M2'}, f_holes: {m:141, f:96, d:0.43, t:2.6, mode:'M2'}, f_braced: {m:210, f:205, d:0.43, t:2.6, mode:'M4'}, back: {m:240, f:240, d:0.85, t:2.3, mode:'M5'} }
        };

        function initProjectUI() {
            const inst = document.getElementById('instrument').value;
            const stepSel = document.getElementById('step');
            const archCont = document.getElementById('archingContainer');

            // 1. Arching Profile Visibility Logic
            const isViolinFamily = ['violin', 'viola', 'cello', 'bass_violin'].includes(inst);
            archCont.style.display = isViolinFamily ? 'block' : 'none';

            // 2. Build Milestone Logic
            if (currentPlate === 'front') {
                if (inst.includes('hauser') || inst.includes('om')) {
                    stepSel.innerHTML = `<option value="f_raw">Raw Graduation</option><option value="f_holes">Soundhole Cut</option><option value="f_braced">Bracing Phase</option>`;
                } else {
                    // Unified sequence for both Violins and Viols
                    stepSel.innerHTML = `<option value="f_raw">Plate Graduation</option><option value="f_holes">F-Holes / C-Holes Cut</option><option value="f_barred">Bass Bar Phase</option>`;
                }
            } else {
                stepSel.innerHTML = `<option value="back">Final Back Graduation</option>`;
            }
            calculate();
        }

        function setPlate(type) {
            currentPlate = type;
            document.getElementById('btnFront').className = type === 'front' ? 'py-2 text-[10px] font-black rounded bg-zinc-900 text-white' : 'py-2 text-[10px] font-black rounded bg-stone-100 text-zinc-400';
            document.getElementById('btnBack').className = type === 'back' ? 'py-2 text-[10px] font-black rounded bg-zinc-900 text-white' : 'py-2 text-[10px] font-black rounded bg-stone-100 text-zinc-400';
            initProjectUI();
        }

        function calculate() {
            const inst = document.getElementById('instrument').value;
            const step = document.getElementById('step').value;
            const arch = document.getElementById('arching').value;
            const dens = parseFloat(document.getElementById('density').value) || 0.37;
            const ref = library[inst][step] || library[inst].back;
            
            let tM = ref.m * (dens / ref.d);
            let tF = ref.f * Math.sqrt(ref.d / dens);
            
            // Arching correction only applies if the dropdown is visible
            const isViolinFamily = ['violin', 'viola', 'cello', 'bass_violin'].includes(inst);
            if (isViolinFamily && arch === 'high') { 
                tM *= 0.94; // High arch allows less mass for same strength
                tF *= 1.02; // High arch is inherently stiffer
            }
            
            document.getElementById('targetMass').innerText = Math.round(tM) + 'g';
            document.getElementById('targetFreq').innerText = Math.round(tF) + 'Hz';
            document.getElementById('predictedThickness').innerText = (ref.t * (ref.d / dens)).toFixed(1) + 'mm';
            document.getElementById('targetModeLabel').innerText = `Target Freq (${ref.mode})`;
            
            diagnose(); 
        }

        function getDoctorAdvice(eff, inst, step) {
            let advice = {diag: "", comp: ""};
            
            // 3. Deep Conditional Logic for Advice
            if (eff >= 97 && eff <= 103) {
                advice.diag = "SYSTEM RATIONALIZED. The plate is exhibiting ideal stiffness-to-mass ratio.";
                advice.comp = "Stop removing material. If the tap tone is clear and sustains well, you have reached the 'sweet spot'. Further thinning will risk a 'tubby' or 'hollow' tone.";
            } else if (eff < 97) {
                // Low Efficiency (Too heavy for its stiffness)
                advice.diag = "SYSTEM DAMPED (Inefficient). The plate is carrying non-structural mass.";
                if (inst.includes('viol_')) {
                    advice.comp = "<b>Viol Specific:</b> Viols require active vibration across the entire surface. Thin the 'wings' (outer upper/lower bouts) aggressively. Unlike a violin, the viol perimeter should not be rigid.";
                } else {
                    advice.comp = "Focus on the 'Lungs' (the area between the C-bouts and the upper/lower blocks). Thinning the recurve here will drop mass significantly while preserving longitudinal spine stiffness.";
                }
            } else {
                // High Efficiency (Too stiff for its mass)
                advice.diag = "SYSTEM OVER-STIFF (Brittle). The plate is too rigid to pump air effectively.";
                advice.comp = "The plate is effectively too thick for this specific piece of wood. Reduce the central spine thickness carefully. A plate this stiff will lack bass response and warmth.";
            }

            // Context-Specific Step Advice
            if (step === 'f_holes') {
                advice.comp += "<br><br><b>Warning:</b> Cutting the holes breaks the longitudinal arch. You will see a frequency drop (approx -10% on Viols). Do not panic and remove more wood; this drop is structural and expected.";
            } 
            else if (step === 'f_barred') {
                advice.comp += "<br><br><b>Bass Bar Tuning:</b> The goal is to restore the frequency lost when cutting the holes. Trim the bar height, not the plate. Tune the bar until you regain the pre-cut frequency.";
            }

            // Instrument Family nuance
            if (inst.includes('jaye')) {
                advice.comp += "<br><br><b>Jaye Note:</b> With 120mm deep ribs, the air resonance (A0) will be deep. The plate must be light (flexible) to couple with this large air volume. Err on the side of flexibility.";
            }

            return advice;
        }

        function diagnose() {
            const cM = parseFloat(document.getElementById('currMass').value);
            const cF = parseFloat(document.getElementById('currFreq').value);
            const tM = parseFloat(document.getElementById('targetMass').innerText);
            const tF = parseFloat(document.getElementById('targetFreq').innerText);
            
            const effTag = document.getElementById('efficiencyTag');
            const diagBox = document.getElementById('diagnosisBox');
            const compAdvice = document.getElementById('compAdvice');

            if (!cM || !cF) { effTag.innerText = "--%"; return; }

            const eff = Math.round(((cF / cM) / (tF / tM)) * 100);
            effTag.innerText = eff + "%";

            const advice = getDoctorAdvice(eff, document.getElementById('instrument').value, document.getElementById('step').value);
            diagBox.innerText = advice.diag;
            compAdvice.innerHTML = advice.comp;
        }

        function saveToLog() {
            const log = {
                step: document.getElementById('step').value,
                mass: document.getElementById('currMass').value,
                freq: document.getElementById('currFreq').value,
                eff: document.getElementById('efficiencyTag').innerText
            };
            if(!log.mass || !log.freq) return;
            history.unshift(log);
            document.getElementById('historyBody').innerHTML = history.map(h => `
                <tr class="border-b border-stone-50">
                    <td class="py-3 uppercase font-bold text-zinc-400 text-[10px]">${h.step.replace('f_', '')}</td>
                    <td class="py-3 font-bold">${h.mass}g</td>
                    <td class="py-3 font-bold">${h.freq}Hz</td>
                    <td class="py-3 text-amber-600 font-black">${h.eff}</td>
                </tr>
            `).join('');
        }

        initProjectUI();
    </script>
</body>
</html>
