<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rational Luthier Assistant v2.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card { border-radius: 8px; transition: all 0.2s ease; }
        .input-focus:focus { outline: 2px solid #92400e; border-color: transparent; }
        .tab-active { border-bottom: 3px solid #b45309; color: #78350f; }
    </style>
</head>
<body class="bg-stone-100 text-stone-900 font-sans p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="mb-8 border-b-2 border-stone-800 pb-4 flex justify-between items-center">
            <h1 class="text-3xl font-black italic tracking-tighter uppercase">Rational Luthier <span class="text-amber-700">v2.5</span></h1>
            <div id="calibrationStatus" class="text-[10px] font-bold px-3 py-1 bg-stone-200 rounded uppercase">Baseline: Factory Specs</div>
        </header>

        <div class="grid grid-cols-1 xl:grid-cols-4 gap-8">
            
            <div class="space-y-6">
                <section class="bg-white p-5 shadow card border-t-4 border-amber-900">
                    <h2 class="text-[10px] font-black uppercase tracking-widest text-stone-400 mb-4">Master Calibration</h2>
                    <p class="text-[10px] text-stone-500 mb-4 italic">Input specs from a master instrument to set a custom 100% baseline.</p>
                    <div class="grid grid-cols-2 gap-2 mb-4">
                        <input type="number" id="calMass" placeholder="Ref Mass" class="p-2 text-xs bg-stone-50 border border-stone-200 rounded font-mono">
                        <input type="number" id="calFreq" placeholder="Ref Freq" class="p-2 text-xs bg-stone-50 border border-stone-200 rounded font-mono">
                    </div>
                    <button onclick="applyCalibration()" class="w-full py-2 bg-amber-900 text-white text-[10px] font-bold uppercase rounded hover:bg-amber-800">Set Master Baseline</button>
                    <button onclick="resetCalibration()" class="w-full mt-2 py-1 text-[9px] text-stone-400 uppercase font-bold hover:text-red-700 transition">Reset to Library</button>
                </section>

                <section class="bg-white p-5 shadow card border-t-4 border-stone-800">
                    <h2 class="text-[10px] font-black uppercase tracking-widest text-stone-400 mb-4">Material Properties</h2>
                    <label class="block text-[10px] font-bold mb-1 uppercase text-stone-500">Density (ρ)</label>
                    <input type="number" id="density" value="0.37" step="0.01" class="w-full p-2 bg-stone-50 border border-stone-200 mb-4 font-mono font-bold" oninput="updateTargets()">

                    <label class="block text-[10px] font-bold mb-1 uppercase text-stone-500">Speed of Sound (m/s)</label>
                    <input type="number" id="speedOfSound" value="5200" class="w-full p-2 bg-stone-50 border border-stone-200 mb-4 font-mono font-bold" oninput="updateTargets()">
                    <div class="text-[9px] text-stone-400 italic">Spruce: 4800-6000 | Maple: 3800-4500</div>
                </section>
            </div>

            <div class="space-y-6">
                <section class="bg-white p-5 shadow card border-t-4 border-stone-800">
                    <h2 class="text-[10px] font-black uppercase tracking-widest text-stone-400 mb-4">Project Architecture</h2>
                    
                    <label class="block text-[10px] font-bold mb-1 uppercase text-stone-500">Instrument Model</label>
                    <select id="instrument" class="w-full p-2 bg-stone-50 border border-stone-200 mb-4 font-bold" onchange="setPlate(currentPlate)">
                        <option value="violin">Violin</option>
                        <option value="cello">Cello</option>
                        <option value="bass_violin">Borbon Bass</option>
                        <option value="classical_guitar">Classical Guitar</option>
                    </select>

                    <div class="grid grid-cols-2 gap-2 mb-4">
                        <button id="btnFront" onclick="setPlate('front')" class="py-2 text-[10px] font-black border-2 border-stone-800 bg-stone-800 text-white rounded">FRONT</button>
                        <button id="btnBack" onclick="setPlate('back')" class="py-2 text-[10px] font-black border-2 border-stone-200 text-stone-400 rounded">BACK</button>
                    </div>

                    <label class="block text-[10px] font-bold mb-1 uppercase text-stone-500">Construction Step</label>
                    <select id="state" class="w-full p-2 bg-amber-50 border border-amber-200 font-bold text-amber-900 mb-4" onchange="updateTargets()">
                    </select>

                    <label class="block text-[10px] font-bold mb-1 uppercase text-stone-500">Arching Architecture</label>
                    <select id="arching" class="w-full p-2 bg-stone-50 border border-stone-200 font-bold" onchange="updateTargets()">
                        <option value="flat">Flat/Full (Strad/Hauser)</option>
                        <option value="high">High/Steep (Stainer/Amati)</option>
                    </select>
                </section>
            </div>

            <div class="xl:col-span-2 space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white p-6 shadow card border-b-4 border-amber-700">
                        <span class="text-[10px] font-black uppercase text-stone-400 tracking-wider">Dynamic Target Mass</span>
                        <div id="targetMass" class="text-5xl font-mono font-black text-stone-800 mt-2">--</div>
                    </div>
                    <div class="bg-white p-6 shadow card border-b-4 border-stone-800">
                        <span id="freqTitle" class="text-[10px] font-black uppercase text-stone-400 tracking-wider">Target Resonance</span>
                        <div id="targetFreq" class="text-5xl font-mono font-black text-stone-800 mt-2">--</div>
                    </div>
                </div>

                <section class="bg-stone-800 text-white p-8 card">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="font-black italic text-xl uppercase tracking-tighter">Workshop Diagnosis</h2>
                        <div id="efficiencyTag" class="px-4 py-2 bg-amber-600 text-white font-black text-lg rounded">--%</div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-8 mb-6">
                        <div>
                            <label class="text-[9px] font-bold text-stone-400 uppercase">Current Mass (g)</label>
                            <input type="number" id="currMass" class="w-full bg-stone-700 border-none p-3 font-mono text-2xl text-amber-400" oninput="runDoctor()">
                        </div>
                        <div>
                            <label class="text-[9px] font-bold text-stone-400 uppercase">Current Freq (Hz)</label>
                            <input type="number" id="currFreq" class="w-full bg-stone-700 border-none p-3 font-mono text-2xl text-amber-400" oninput="runDoctor()">
                        </div>
                    </div>
                    <p id="diagnosisMessage" class="text-sm font-medium border-l-4 border-amber-500 pl-4 py-2 bg-stone-700/50 rounded-r"></p>
                </section>

                <div class="bg-white p-4 shadow card">
                    <h3 class="text-[10px] font-black uppercase text-stone-400 mb-3 tracking-widest">History Log</h3>
                    <div id="historyContainer" class="space-y-1 max-h-40 overflow-y-auto"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPlate = 'front';
        let customK = null;

        const library = {
            violin: {
                front_raw: { m: 62, f: 300, d: 0.37, mode: 'M5' },
                front_holes: { m: 60, f: 288, d: 0.37, mode: 'M5' },
                front_barred: { m: 66, f: 340, d: 0.37, mode: 'M5' },
                back: { m: 105, f: 365, d: 0.58, mode: 'M5' }
            },
            classical_guitar: {
                front_raw: { m: 135, f: 100, d: 0.40, mode: 'M2' },
                front_holes: { m: 130, f: 94, d: 0.40, mode: 'M2' },
                front_braced: { m: 175, f: 185, d: 0.40, mode: 'M4' },
                back: { m: 210, f: 220, d: 0.80, mode: 'M5' }
            }
        };

        function applyCalibration() {
            const m = parseFloat(document.getElementById('calMass').value);
            const f = parseFloat(document.getElementById('calFreq').value);
            if(!m || !f) return alert("Enter Master Mass and Freq");
            
            // Calculate Rational Constant K: f/m adjusted for assumed standard density
            customK = f / m;
            document.getElementById('calibrationStatus').innerText = "Baseline: CUSTOM MASTER";
            document.getElementById('calibrationStatus').classList.replace('bg-stone-200', 'bg-amber-100');
            updateTargets();
        }

        function resetCalibration() {
            customK = null;
            document.getElementById('calibrationStatus').innerText = "Baseline: FACTORY SPECS";
            document.getElementById('calibrationStatus').classList.replace('bg-amber-100', 'bg-stone-200');
            updateTargets();
        }

        function setPlate(type) {
            currentPlate = type;
            const inst = document.getElementById('instrument').value;
            const stateSel = document.getElementById('state');
            
            document.getElementById('btnFront').className = type === 'front' ? 'py-2 text-[10px] font-black border-2 border-stone-800 bg-stone-800 text-white rounded' : 'py-2 text-[10px] font-black border-2 border-stone-300 text-stone-400 rounded';
            document.getElementById('btnBack').className = type === 'back' ? 'py-2 text-[10px] font-black border-2 border-stone-800 bg-stone-800 text-white rounded' : 'py-2 text-[10px] font-black border-2 border-stone-300 text-stone-400 rounded';
            
            if(type === 'front') {
                stateSel.innerHTML = inst.includes('guitar') ? 
                    '<option value="raw">Raw Plate</option><option value="holes">Soundhole Cut</option><option value="braced">Braced</option>' :
                    '<option value="raw">Raw Plate</option><option value="holes">F-Holes Cut</option><option value="barred">With Bass Bar</option>';
            } else {
                stateSel.innerHTML = '<option value="final">Back Graduation</option>';
            }
            updateTargets();
        }

        function updateTargets() {
            const inst = document.getElementById('instrument').value;
            const state = document.getElementById('state').value;
            const arch = document.getElementById('arching').value;
            const dens = parseFloat(document.getElementById('density').value);
            const speed = parseFloat(document.getElementById('speedOfSound').value);

            let ref = (currentPlate === 'front') ? library[inst][state] : library[inst].back;
            if(!ref) ref = library[inst].back;

            let tM, tF;

            if (customK) {
                // Scaling custom baseline by density and speed of sound
                tM = ref.m * (dens / ref.d);
                tF = tM * customK * (speed / 5200); // Speed modifier
            } else {
                tM = ref.m * (dens / ref.d);
                tF = ref.f * Math.sqrt(ref.d / dens) * (speed / 5200);
            }

            // Arching Adjustment
            if(arch === 'high') { tM *= 0.94; tF *= 1.03; }

            document.getElementById('targetMass').innerText = Math.round(tM) + 'g';
            document.getElementById('targetFreq').innerText = Math.round(tF) + 'Hz';
            runDoctor();
        }

        function runDoctor() {
            const cM = parseFloat(document.getElementById('currMass').value);
            const cF = parseFloat(document.getElementById('currFreq').value);
            const tM = parseFloat(document.getElementById('targetMass').innerText);
            const tF = parseFloat(document.getElementById('targetFreq').innerText);

            if(!cM || !cF) return;

            let eff = Math.round(((cF / cM) / (tF / tM)) * 100);
            document.getElementById('efficiencyTag').innerText = eff + "%";
            
            const diag = document.getElementById('diagnosisMessage');
            if(eff >= 98 && eff <= 102) diag.innerText = "MATCH: Your plate geometry is perfectly scaled to the master baseline.";
            else if (eff < 98) diag.innerText = "OVER-DAMPED: The plate is too heavy for its stiffness. Thin the bouts/lungs.";
            else diag.innerText = "OVER-STIFF: The resonance is too high for the mass. Thin the spine/center.";
        }
    </script>
</body>
</html>
